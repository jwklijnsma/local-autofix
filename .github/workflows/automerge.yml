name: automerge

# Merges dependency PRs from Renovate and Dependabot on their own once every other
# check on the PR has passed. Only patch and minor updates (for 0.x versions: only
# patch updates); majors stay open for a person to review. Renovate PRs are also
# recognised by their renovate/ branch, since renovate.yml opens them with a
# personal token (so not as renovate[bot]).
#
# Opt out for one PR: add the label "no-automerge", or mark it as a draft.
#
# The merge is done with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN don't
# start other workflows. So after merging, this workflow starts the docs site
# deploy itself when the PR touched the site.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
    branches: [main]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  automerge:
    if: >-
      (contains(fromJSON('["renovate[bot]","dependabot[bot]"]'), github.event.pull_request.user.login)
       || startsWith(github.event.pull_request.head.ref, 'renovate/'))
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # merge, delete the branch
      pull-requests: write
      checks: read
      actions: write         # start docs on main after the merge
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      SELF: automerge
    steps:
      - name: Only patch and minor updates
        id: kind
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # shellcheck disable=SC2016  # the backticks are literal
          # Renovate: "`1.2.3` → `1.2.4`" in the PR table. Dependabot: "from 1.2.3 to 1.2.4".
          pairs=$( { printf '%s\n' "$BODY" | grep -oE '`[=^~>v]*[0-9][^`]*` → `[=^~>v]*[0-9][^`]*`' | tr -d '`' | sed 's/ → / /; s/[=^~>]//g';
                     printf '%s\n%s\n' "$TITLE" "$BODY" | grep -oE 'from v?[0-9][^ ]* to v?[0-9][^ ]*' | sed 's/^from //; s/ to / /'; } | sed 's/\.$//' | sort -u)
          if [ -z "$pairs" ]; then
            echo "No version change found in the PR (digest or lock file update?); leaving it for a person." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ok=true
          while read -r old new; do
            o=${old#v}; n=${new#v}
            omaj=${o%%.*}; nmaj=${n%%.*}
            orest=${o#*.}; nrest=${n#*.}
            omin=${orest%%.*}; nmin=${nrest%%.*}
            if [ "$omaj" != "$nmaj" ] || { [ "$omaj" = 0 ] && [ "$omin" != "$nmin" ]; }; then
              echo "- $old → $new: **major**, needs a person" >> "$GITHUB_STEP_SUMMARY"; ok=false
            else
              echo "- $old → $new: patch/minor" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$pairs"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Wait for the other checks
        if: steps.kind.outputs.ok == 'true'
        run: |
          sleep 60   # give the other workflows time to register their checks
          for _ in $(seq 1 110); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                     --jq "[.check_runs[] | select(.name != \"$SELF\")]")
            total=$(jq length <<< "$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")
            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not)) | .name] | join(", ")' <<< "$runs")
            if [ -n "$failed" ]; then
              echo "Checks failed: $failed. Not merging." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All $total checks passed." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "waiting: $pending of $total checks still running"
            sleep 30
          done
          echo "Checks did not finish in time. Not merging." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1

      - name: Merge
        if: steps.kind.outputs.ok == 'true'
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR")
          state=$(jq -r .state <<< "$pr"); head=$(jq -r .head.sha <<< "$pr"); ref=$(jq -r .head.ref <<< "$pr")
          [ "$state" = open ] || { echo "PR is $state; nothing to do."; exit 0; }
          if [ "$head" != "$SHA" ]; then
            # Only commits by github-actions[bot] (which start no new checks) are merged
            # along; anyone else's commit gets its own run.
            others=$(gh api "repos/$REPO/compare/$SHA...$head" \
                       --jq '[.commits[] | select(.author.login != "github-actions[bot]")] | length')
            if [ "$others" != 0 ]; then
              echo "The PR changed while waiting; the run for the new commit decides."; exit 0
            fi
            echo "Merging $head (adds github-actions[bot] commits on top of the checked commit)."
          fi
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$head" --jq .message
          gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1 || true
          echo "Merged #$PR." >> "$GITHUB_STEP_SUMMARY"
          echo "merged=true" >> "$GITHUB_ENV"

      - name: Run the main-branch workflows
        if: env.merged == 'true'
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          if grep -qE '^(docs/|zensical\.toml$|requirements-docs\.txt$|\.github/workflows/docs\.yml$)' <<< "$files"; then
            gh workflow run docs.yml --repo "$REPO" --ref main
            echo "Started the docs deploy on main." >> "$GITHUB_STEP_SUMMARY"
          fi
