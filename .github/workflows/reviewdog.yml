# Lint with reviewdog: findings show up as PR review comments and as
# check annotations on pushes to main. Non-blocking (fail-level none).
name: reviewdog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: reviewdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RD_REPORTER: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
      RD_FILTER: ${{ github.event_name == 'pull_request' && 'added' || 'nofilter' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: latest

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /tmp
          /tmp/actionlint -oneline > /tmp/actionlint.txt || true
          reviewdog -name=actionlint -efm='%f:%l:%c: %m' \
            -reporter="$RD_REPORTER" -filter-mode="$RD_FILTER" -level=warning < /tmp/actionlint.txt

      - name: ruff
        run: |
          pipx install ruff
          ruff check --output-format=rdjson --exit-zero . > /tmp/ruff.json
          reviewdog -name=ruff -f=rdjson \
            -reporter="$RD_REPORTER" -filter-mode="$RD_FILTER" -level=warning < /tmp/ruff.json

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -f parsable -d "{extends: relaxed, ignore: '**/templates/**', rules: {line-length: disable}}" . > /tmp/yamllint.txt || true
          reviewdog -name=yamllint -efm='%f:%l:%c: %m' \
            -reporter="$RD_REPORTER" -filter-mode="$RD_FILTER" -level=warning < /tmp/yamllint.txt
